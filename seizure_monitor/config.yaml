# Seizure monitor configuration.
# Every threshold lives here; the code contains no magic numbers.
# Tune detector values by watching the live window in main.py.

capture:
  width: 640               # frames are downscaled to this width (aspect kept) to stay real-time on CPU
  process_fps: 15          # max frames per second we run pose estimation on

pose:
  # "full" is as fast as "lite" on our test laptop and more accurate; use "lite" on slower machines.
  model: full
  model_dir: models
  model_url: https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_{model}/float16/latest/pose_landmarker_{model}.task
  min_detection_confidence: 0.5
  min_tracking_confidence: 0.5
  # Patient selection: detect several people and keep the one in the bed (not a nurse or visitor).
  num_poses: 1             # people detected per frame. 3 picks the patient better among several people,
                           # but costs ~73 ms/frame vs ~29 ms (breaks 15 fps on our laptop) and gave no
                           # detection gain on hospital video. With 1, someone outside the bed is ignored.
  min_in_bed_fraction: 0.6 # share of a person's visible body points that must be inside motion.bed_area
  max_jump: 0.25           # keep following the same patient if they moved less than this x bed width

detector:
  # --- Signal preparation ---
  resample_hz: 15          # trajectories are resampled to this fixed rate so results don't depend on camera fps
  window_s: 4.0            # length of the sliding analysis window
  hop_s: 0.25              # how often the window is re-analysed
  min_visibility: 0.5      # landmarks below this MediaPipe visibility are treated as missing
  max_gap_s: 0.5           # missing stretches up to this long are filled by interpolation; longer -> point unusable in this window
  body_lost_reset_s: 2.0   # if both shoulders are missing this long, clear history and start over
  min_shoulder_width_px: 20  # below this the person is too small/side-on for reliable normalisation

  # --- Rhythm features (per tracked point) ---
  band_hz: [1.5, 6.0]      # frequency band typical of clonic jerking
  min_amplitude: 0.04      # RMS movement in shoulder widths; filters out pose-estimation jitter
  min_band_ratio: 0.75     # fraction of movement power inside band_hz. NOTE: white noise already scores ~0.6 at 15 Hz
  min_prominence: 10.0     # in-band peak power / median in-band power. Random noise reaches ~8; a clear rhythm is 100+

  # Points are grouped into limbs; a limb is rhythmic if any of its points is.
  # Grouping stops wrist+elbow on the same arm from counting as two limbs.
  limbs:
    left_arm: [left_wrist, left_elbow]
    right_arm: [right_wrist, right_elbow]
    left_leg: [left_knee, left_ankle]
    right_leg: [right_knee, right_ankle]
    trunk: [left_shoulder, right_shoulder]
  min_rhythmic_limbs: 2    # a window is "rhythmic" only if at least this many limbs are

  # --- Event logic (hysteresis) ---
  onset_s: 8.0             # rhythm must persist this long before an event is declared
  demo_onset_s: 3.0        # used instead of onset_s when main.py runs with --demo
  rhythm_gap_tolerance_s: 1.0  # brief non-rhythmic windows shorter than this don't break a rhythm run
  end_hold_s: 5.0          # event ends after rhythm has been absent this long

  # --- Confidence score (heuristic 0-1, NOT a probability) ---
  confidence:
    weight_limbs: 0.4      # share of visible limbs that are rhythmic
    weight_band: 0.3       # how far band_ratio exceeds its threshold
    weight_prominence: 0.3 # how far prominence exceeds its threshold
    band_ratio_full: 0.95  # band_ratio at which the band score reaches 1
    prominence_full: 30.0  # prominence at which the prominence score reaches 1

# Detector A: sustained intense movement inside the bed area (optical flow, no pose needed).
# Works through blankets and ignores people beside the bed. See monitor/motion.py.
motion:
  enabled: true
  bed_area: [0.085, 0.023, 0.861, 0.989]           # [x0, y0, x1, y1] as fractions of the frame (0-1). Set it with
                           # tools/set_bed_area.py. null = whole frame (less specific: anyone moving counts)
  flow_width: 160          # bed area is resized to this width before optical flow (cost vs detail)
  grid: 4                  # bed area split into grid x grid cells
  top_cells: 4             # intensity = mean speed of the N most-moving cells (convulsions may involve part of the bed)
  min_speed: 0.04          # bed widths per second counted as "intense". Normal footage stayed below ~0.01
  sustain_s: 5.0           # intense movement must fill most of this long a window to start an event
  demo_sustain_s: 3.0      # used instead of sustain_s with --demo
  sustain_fraction: 0.8    # "most" = this share of the window (real movement has brief pauses).
                           # Earliest alert = sustain_s x sustain_fraction after movement starts (4 s)
  end_hold_s: 5.0          # event ends after this long without intense movement
  confidence_full_speed: 0.15  # heuristic confidence reaches 1 at this mean speed (NOT a probability)

monitor:
  source_name: Bedroom camera   # shown in clips, the event log and alerts
  start_armed: true        # start monitoring immediately; pause/resume with 'p' or the dashboard button

recording:
  enabled: true            # set false while tuning if you don't want clips
  data_dir: data           # events.db and clips/ live here (gitignored)
  pre_event_s: 30          # footage kept from before detection (rhythm builds up before we're sure)
  post_event_s: 30         # keep recording this long after the event ends
  fps: 15                  # clip frame rate; should match capture.process_fps
  jpeg_quality: 80         # pre-event buffer is JPEG-compressed to keep memory small (~20 MB for 30 s)

privacy:
  blur_person: true        # pixelate the person in saved clips (live window is not blurred)
  pixel_blocks: 24         # blocks across the person's longer side; smaller = stronger anonymisation.
                           # Movement stays visible via the skeleton drawn on top.
  margin: 0.15             # extra space around the person's box, as a fraction of its size
  hold_s: 2.0              # if the person is lost longer than this, pixelate the whole frame (fail-safe)

alerts:
  escalate_after_s: 30     # no "I'm with them" within this time -> urgent resend + call flag for the Android app
  cooldown_s: 60           # events closer together than this are one incident: one alert, one "ended" message
  ack_stops_alarm: true    # pressing "I'm with them" also silences the local alarm
  alarm:
    enabled: true
    volume: 0.8            # 0-1
    tones_hz: [880, 440]   # alternating high/low beeps: hard to sleep through, distinct from phone sounds
    beep_s: 0.3
    gap_s: 0.05
  telegram:
    enabled: true          # also needs TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID in .env
    send_snapshot: true    # attach a still image (pixelated if privacy.blur_person is on)
    request_timeout_s: 10  # every network call times out; never blocks detection
    poll_timeout_s: 25     # long-poll duration when waiting for button presses
    send_retries: 3
    retry_backoff_s: 2

dashboard:
  enabled: true
  host: 127.0.0.1          # this computer only. 0.0.0.0 = reachable from phones on your Wi-Fi
                           # (needed for the Android call app) but there is NO login: trusted networks only
  port: 8000
  stream_fps: 10           # live view frame rate in the browser
  stream_jpeg_quality: 70
  blur_stream: false       # pixelate the person in the live web view too
